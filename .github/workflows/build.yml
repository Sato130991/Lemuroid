name: Build Lemuroid APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug (descarga cores bajo demanda)
        run: ./gradlew :lemuroid-app:assembleFreeDynamicDebug -x ktlintCheck

      - name: Subir APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-debug-apk
          path: lemuroid-app/build/outputs/apk/freeDynamic/debug/*.apk
